name: Publiceer app (GitHub Pages)

# Publiceert alleen de app zelf. Er staat geen registerdata in deze repository:
# het Excel-bestand wordt op de telefoon geopend en blijft daar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site samenstellen
        run: |
          mkdir -p _site/tests
          cp -r index.html manifest.webmanifest sw.js css js icons vendor _site/
          cp tests/fixture.xlsx _site/tests/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
